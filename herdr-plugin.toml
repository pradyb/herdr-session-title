id = "pradyb.session-title"
name = "Session Title"
version = "0.1.0"
# Only 0.9.3 has been tested.
min_herdr_version = "0.9.3"
description = "Names a workspace after its Claude Code session (/rename)"
platforms = ["linux", "macos", "windows"]

# Spawns a detached daemon that polls Claude transcripts for /rename titles;
# it exits when the herdr server stops.
[[startup]]
command = ["python3", "session_title.py"]

# Startup hooks don't run on link/enable, so start it by hand then (no-op if running).
[[actions]]
id = "start"
title = "Start the session-title daemon"
contexts = ["global"]
command = ["python3", "session_title.py"]
